<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ city }} weather</title>
<style>
  body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; padding: 28px; }
  a { color: #94a3b8; margin-right: 14px; text-decoration: none; }
  a.on { color: #facc15; font-weight: bold; }
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 240px; margin-top: 40px; }
  .bar { width: 34px; background: #38bdf8; border-radius: 6px 6px 0 0; position: relative; }
  .bar.rain { background: #a78bfa; }
  .bar b { position: absolute; top: -22px; width: 100%; text-align: center; font-size: 13px; }
  .bar span { position: absolute; bottom: -22px; width: 100%; text-align: center; font-size: 12px; color: #94a3b8; }
  .ai { margin-top: 48px; padding: 14px 18px; border-left: 4px solid #facc15; background: #1e293b; max-width: 640px; }
</style>
</head>
<body>
  <nav>{% for name in cities %}<a href="/?city={{ name }}" class="{{ 'on' if name == city }}">{{ name }}</a>{% endfor %}</nav>
  <h1>{{ city }} · next 12 hours</h1>
  <p>Warmest at {{ warmest.time }} · {{ warmest.temp }}°F, {{ warmest.sky }}</p>
  <div class="chart">
    {% for h in hours %}
    <div class="bar {{ 'rain' if h.rain >= 50 }}" style="height: {{ [h.temp * 2.5, 10] | max | int }}px" title="{{ h.sky }}, rain {{ h.rain }}%">
      <b>{{ h.temp }}°</b><span>{{ h.time[:2] }}h</span></div>
    {% endfor %}
  </div>
  {% if summary %}<p class="ai">{{ summary }}</p>{% endif %}
</body>
</html>
